<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ product.title }}</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 40px; max-width: 600px; background: #fafafa;">
    <div style="background: #fff; padding: 30px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
        <h1 style="margin-top: 0; color: #333;">{{ product.title }}</h1>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <p><b>Категория:</b> {{ product.category.name }}</p>
        <p><b>Производитель:</b> {{ product.manufacturer.name }} (Страна: {{ product.manufacturer.country }})</p>
        <p style="color: #555; line-height: 1.6;"><b>Описание:</b><br>{{ product.description }}</p>
        <p><b>Остаток на складе:</b> {{ product.stock_quantity }} шт.</p>
        <h2 style="color: #28a745; margin-top: 20px;">Цена: {{ product.price }} руб.</h2>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <a href="{% url 'product_list' %}" style="display: inline-block; background: #0066cc; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; font-weight: bold;">← В каталог</a>
    </div>
</body>
</html>
